name: dev-services

services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: "no"

    env_file:
      - .env

    environment:
      TZ: ${TZ}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - dev-network

  redis:
    image: redis:8
    container_name: redis
    restart: "no"

    env_file:
      - .env

    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - dev-network

  mongodb:
    image: mongo:8.0.17
    container_name: mongodb
    restart: "no"

    env_file:
      - .env

    environment:
      TZ: ${TZ}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}

    ports:
      - "127.0.0.1:27017:27017"

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'echo ''db.runCommand("ping").ok'' | mongosh -u "$${MONGO_USER}" -p "$${MONGO_PASSWORD}" --authenticationDatabase admin localhost/admin --quiet',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - dev-network

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    restart: "no"

    env_file:
      - .env

    environment:
      TZ: ${TZ}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - dev-network

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs
    restart: "no"

    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}

    command: ["mini", "-dir=/data", "-s3"]

    ports:
          - "127.0.0.1:8333:8333"
          - "127.0.0.1:8888:8888"

    volumes:
      - seaweedfs_data:/data

    networks:
      - dev-network

  # MongoDB browser interface
  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: mongo-express
    restart: "no"

    env_file:
      - .env

    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD}
      ME_CONFIG_MONGODB_AUTH_DATABASE: admin
      ME_CONFIG_BASICAUTH_ENABLED: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${ADMIN_EMAIL}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ADMIN_PASSWORD}

    ports:
      - "127.0.0.1:8081:8081"

    depends_on:
      mongodb:
        condition: service_healthy

    networks:
      - dev-network

  # Redis browser interface
  redisinsight:
    image: redis/redisinsight:3.8.0
    container_name: redisinsight
    restart: "no"

    ports:
      - "127.0.0.1:5540:5540"

    volumes:
      - redisinsight_data:/data

    networks:
      - dev-network

  # PostgreSQL browser interface
  pgadmin:
    image: dpage/pgadmin4:9.17
    container_name: pgadmin
    restart: "no"

    env_file:
      - .env

    environment:
      PGADMIN_DEFAULT_EMAIL: ${ADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${ADMIN_PASSWORD}

    ports:
      - "127.0.0.1:5050:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - dev-network

volumes:
  postgres_data:
  redis_data:
  mongodb_data:
  rabbitmq_data:
  minio_data:
  meili_data:
  redisinsight_data:
  pgadmin_data:
  seaweedfs_data:

networks:
  dev-network:
    external: true
