name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          version=0.10.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${version}/shellcheck-v${version}.linux.x86_64.tar.xz" -o /tmp/shellcheck.tar.xz
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-v${version}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Run shellcheck
        run: shellcheck install.sh doctor.sh scripts/*.sh

  syntax:
    name: Bash syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check syntax of all shell scripts
        run: |
          scripts=("*.sh" "scripts/*.sh" "shell/*")
          fail=0
          for pattern in "${scripts[@]}"; do
            for f in $pattern; do
              echo "Checking $f"
              if ! bash -n "$f"; then
                fail=1
              fi
            done
          done
          exit $fail
